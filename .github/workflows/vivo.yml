name: Estado en vivo de estaciones (cada 5 min)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: datos
jobs:
  vivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/actualizar_vivo.py
      - run: |
          git config user.name "actualizador-datos"
          git config user.email "actions@users.noreply.github.com"
          git add vivo.json estaciones_epm.json
          git diff --cached --quiet || (git commit -m "Estado $(date -u +%H:%M)" && git pull --rebase && git push)
